<form action="/submit" method="POST">
     <div>
          <label for="Full Name">
               Full Name:
          </label>
          <input type="text" name="Full Name" placeholder="Enter your full Name....." required>
     </div>
     <br>
     <br>
     <div>
          <label for="Email">Email:</label>
          <input type="email" name="Email" placeholder="Enter your Email...." required>
     </div>
     <br>
     <br>
     <div>
          <label for="Phone Number">
               Phone Number
          </label>
          <input type="tel" name="Phone Number" placeholder="Enter your phone Number...." required>
     </div>
     <br>
     <br>
     <div>
          <label for="Subject Category">
               Subject Category
               <label for="inquiryType">Subject Category:</label>
               <select id="inquiryType" name="inquiryType" required>
                    <option value="support">Customer Support</option>
                    <option value="sales">Sales Inquiry</option>
                    <option value="feedback">General Feedback</option>

               </select>
               <br>
               <br>

               <fieldset>
                    <legend>Preferred Contact Method</legend>
                    <input type="radio" id="contactEmail" name="contactMethod" value="email" checked>
                    <label for="contactEmail">Email</label>

                    <input type="radio" id="contactPhone" name="contactMethod" value="phone">
                    <label for="contactPhone">Phone</label>
               </fieldset>
               <br>
               <br>

               <div>
                    <label for="messageBody">Message:</label>
                    <textarea id="messageBody" name="messageBody" rows="5" required></textarea>
               </div>
               <br>
               <br>

               <div>
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the terms and conditions</label>
               </div>
               <br>
               <br>

               <div>
                    <button type="submit">Submit Form</button>
                    <button type="reset">Clear Data</button>
               </div>


     </div>

</form>
